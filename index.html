<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0e1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GONG">
<meta name="description" content="Pop them all. Gong the wall. Ten rooms to get out.">
<title>GONG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171a2e'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23f2c84b' stroke-width='8'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23f2c84b'/%3E%3C/svg%3E">
<style>
:root{--ink:#171a2e;--deep:#0c0e1c;--line:#0a0c17;--paper:#f5f2e9;--muted:#8d93ad;--teal:#35d2bb;--coral:#ff5b61;--amber:#f2c84b;--wall:#454c85;
  --font:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Nunito,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--deep);color:var(--paper);font-family:var(--font);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* HUD: hearts, how many are left, which room */
#hud{position:fixed;inset:0 0 auto 0;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;pointer-events:none;font-weight:800}
#hearts{display:flex;gap:5px}
#hearts svg{width:24px;height:22px;fill:var(--coral);stroke:var(--line);stroke-width:2;transition:transform .2s}
#hearts .lost{fill:transparent;stroke:var(--wall);transform:scale(.8)}
#left{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#left::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--coral);border:3px solid var(--line)}
#left.done b{display:none}
#left.done::before{width:24px;height:24px;background:transparent;border:5px solid var(--amber)}
#side{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
#pauseBtn{pointer-events:auto;width:42px;height:42px;border-radius:13px;border:3px solid var(--wall);background:var(--ink);padding:0;display:grid;place-items:center;cursor:pointer}
#pauseBtn::before{content:"";width:12px;height:14px;border-left:4px solid var(--paper);border-right:4px solid var(--paper)}
#pauseBtn:active{transform:scale(.92)}

/* screens */
#ov{position:fixed;inset:0;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));background:rgba(12,14,28,.78);overflow:auto;touch-action:manipulation}
#ov.clear{background:transparent}
#ov.soft{background:rgba(12,14,28,.35)}
#end{align-self:end;margin-bottom:4vh}
.scr{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#logo{width:min(78vw,400px);height:auto;margin-bottom:2px;overflow:visible}
#logo path{fill:none;stroke:var(--paper);stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
#logo .ring{fill:none;stroke:var(--amber);stroke-width:24}
#logo .boss{fill:var(--amber)}
h1{margin:0;font-size:44px;font-weight:900;letter-spacing:-.01em;line-height:1.05}
p{margin:0;line-height:1.45}
.tag{font-size:21px;font-weight:800}
.note{color:var(--muted);font-size:15px;font-weight:600;max-width:30ch}
.btn{--sh:#1b8f7f;appearance:none;width:100%;min-height:60px;border-radius:18px;border:3px solid var(--line);background:var(--teal);color:var(--line);font:900 21px/1 var(--font);cursor:pointer;box-shadow:0 6px 0 var(--sh);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sh)}
.btn.gold{--sh:#ad8720;background:var(--amber)}
.btn.quiet{--sh:#2a2f5a;min-height:52px;background:var(--ink);color:var(--paper);border-color:var(--wall);font-size:17px;font-weight:800}
.btn:focus-visible,.tile:focus-visible,#pauseBtn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.gap{height:6px}
#title{align-self:stretch;justify-content:center}
#slot{flex:1 1 0;min-height:0;max-height:44vh;width:100%}
#grid{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.tile{appearance:none;aspect-ratio:1;border-radius:15px;border:3px solid var(--wall);background:var(--ink);color:var(--paper);font-family:var(--font);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.tile b{font-size:22px;font-weight:900;line-height:1}
.tile span{display:flex;gap:2px}
.tile i{width:11px;height:11px;background:var(--wall);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.tile i.on{background:var(--amber)}
.tile:disabled{opacity:.32;cursor:default}
.tile:not(:disabled):active{transform:scale(.94)}
@media (max-height:520px){#logo{width:min(46vw,300px)}.scr{gap:9px}.btn{min-height:50px}h1{font-size:34px}}
</style>
</head>
<body>
<canvas id="cv" aria-label="GONG, the playfield"></canvas>
<div id="probe"></div>

<div id="hud" hidden>
  <div id="hearts" aria-label="Hearts">
    <svg viewBox="0 0 24 22"><path d="M12 20.5C5.4 15 1.5 11.4 1.5 7A5.3 5.3 0 0 1 12 5.6 5.3 5.3 0 0 1 22.5 7c0 4.4-3.9 8-10.5 13.5z"/></svg>
    <svg viewBox="0 0 24 22"><path d="M12 20.5C5.4 15 1.5 11.4 1.5 7A5.3 5.3 0 0 1 12 5.6 5.3 5.3 0 0 1 22.5 7c0 4.4-3.9 8-10.5 13.5z"/></svg>
    <svg viewBox="0 0 24 22"><path d="M12 20.5C5.4 15 1.5 11.4 1.5 7A5.3 5.3 0 0 1 12 5.6 5.3 5.3 0 0 1 22.5 7c0 4.4-3.9 8-10.5 13.5z"/></svg>
  </div>
  <div id="left" aria-label="Left to pop"><b id="count">0</b></div>
  <div id="side"><span id="roomno">1/10</span><button id="pauseBtn" aria-label="Pause"></button></div>
</div>

<div id="ov">
  <section id="title" class="scr">
    <svg id="logo" viewBox="0 0 510 150" role="img" aria-label="GONG">
      <path d="M105.3 50A50 50 0 1 0 112 75H80"/>
      <circle class="ring" cx="202" cy="75" r="50"/><circle class="boss" cx="202" cy="75" r="13"/>
      <path d="M292 125V25L358 125V25"/>
      <path d="M491.3 50A50 50 0 1 0 498 75H466"/>
    </svg>
    <div id="slot"></div>
    <p class="tag">Pop them all. Gong the wall.</p>
    <button id="play" class="btn">Play</button>
    <button id="endlessBtn" class="btn gold" hidden>Endless</button>
    <button id="roomsBtn" class="btn quiet">Rooms</button>
    <p class="note">Drag to fly. Let go to brake. When you turn green, double-tap.</p>
  </section>

  <section id="rooms" class="scr" hidden>
    <h1>Ten rooms</h1>
    <p class="note">One star for getting out. One for no lost hearts. One for a long chain.</p>
    <div id="grid"></div>
    <p id="perkNote" class="note"></p>
    <button id="back" class="btn quiet">Back</button>
  </section>

  <section id="pause" class="scr" hidden>
    <h1>Paused</h1>
    <button id="resume" class="btn">Keep going</button>
    <button id="restart" class="btn quiet">Restart room</button>
    <button id="quit" class="btn quiet">Rooms</button>
    <button id="mute" class="btn quiet">Sound on</button>
  </section>

  <section id="dead" class="scr" hidden>
    <h1>Squished</h1>
    <p class="tag">If you stop, you die.</p>
    <p id="deadStats" class="note" hidden></p>
    <div class="gap"></div>
    <button id="retry" class="btn">Try again</button>
    <button id="deadRooms" class="btn quiet">Rooms</button>
  </section>

  <section id="end" class="scr" hidden>
    <h1>Out.</h1>
    <p class="tag">You rang all ten.</p>
    <p id="endStats" class="note"></p>
    <div class="gap"></div>
    <button id="endEndless" class="btn gold">Endless</button>
    <button id="again" class="btn quiet">Play again</button>
    <button id="endRooms" class="btn quiet">Rooms</button>
  </section>
</div>

<!--scripts-->
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/rooms.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<!--/scripts-->
</body>
</html>
